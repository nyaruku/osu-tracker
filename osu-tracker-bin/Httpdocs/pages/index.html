<h1 class="page-title fw-bold text-white mb-4">osu! Tracker</h1>

<div class="row g-3">
    <!-- Main actions -->
    <div class="col-12 col-md-auto">
        <div class="card h-100">
            <div class="card-header accent">Main</div>
            <div class="card-body d-flex flex-column gap-2">
                <button class="btn btn-primary" onclick="sendMessage('#open_ui')">Open osu! Tracker GUI</button>
            </div>
        </div>
    </div>

    <!-- Maintenance -->
    <div class="col-12 col-md-auto">
        <div class="card h-100">
            <div class="card-header">Maintenance</div>
            <div class="card-body d-flex flex-column gap-2">
                <button class="btn btn-outline-info"    onclick="sendMessage('#update')">Update osu! Tracker</button>
                <button class="btn btn-outline-warning" onclick="sendMessage('#restart')">Restart osu! Tracker</button>
                <button class="btn btn-outline-danger"  onclick="sendMessage('#shutdown')">Shutdown osu! Tracker</button>
            </div>
        </div>
    </div>
</div>

<!-- OBS Overlays -->
<h2 class="page-title fw-bold text-white mt-5 mb-4">OBS Overlays</h2>
<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead>
            <tr>
                <th>Name</th>
                <th>Filename</th>
                <th>URL</th>
                <th>Creator</th>
            </tr>
        </thead>
        <tbody>
            {{#overlays}}
            <tr>
                <td>{{title}}</td>
                <td>
                    <code>{{filename}}</code>
                </td>
                <td>
                    <a href="{{route}}" class="text-decoration-none">Open link</a>
                </td>
                <td>{{creator}}</td>
            </tr>
            {{/overlays}}
            {{^overlays}}
            <tr>
                <td colspan="4" class="text-secondary">No overlays found.</td>
            </tr>
            {{/overlays}}
        </tbody>
    </table>
</div>
