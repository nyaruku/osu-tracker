<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <title>{{title}}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap Includes -->
    <link rel="stylesheet" href="static/bootstrap/bootstrap.min.css">
    <script src="static/bootstrap/jquery-3.7.1.min.js"></script>
    <script src="static/bootstrap/bootstrap.min.js"></script>

    <!-- Personal Includes -->
    <link rel="stylesheet" href="static/index.css">
    <script type="text/javascript" src="static/index.js"></script>

    <script>
        let socket;

        function connectWebSocket() {
            socket = new WebSocket("ws://{{hostname}}:{{port}}/ws/main/");

            socket.onmessage = (event) => {
                const el = document.getElementById(`ws-conn-lost`);
                el.hidden = true;
                const data = JSON.parse(event.data);
                if (data["cmd"]) {
                    if (data["cmd"] == "toast"){
                        sendNotif(data["msg"]);
                    }
                    if (data["cmd"] == "reload") {
                        reload();
                    }
                }else{
                    for (const key in data) {
                        const el = document.getElementById(`${key}-display`);
                        if (el) el.textContent = data[key];
                    }
                }
            };
            socket.onopen = () => {
                const el = document.getElementById(`ws-conn-lost`);
                el.hidden = true;
            }
            socket.onclose = () => {
                const el = document.getElementById(`ws-conn-lost`);
                el.hidden = false;
                console.log("WebSocket disconnected. Retrying...");
                setTimeout(connectWebSocket, 1000);
            };
        }

        function sendMessage(cmd, msg) {
            // Object created
            let array = {};
            array["cmd"] = cmd;
            array["msg"] = msg;

            socket.send(JSON.stringify(array));
        }

        function sendNotif(msg) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast align-items-center';
            el.setAttribute('role', 'alert');
            el.setAttribute('aria-live', 'assertive');
            el.setAttribute('aria-atomic', 'true');
            el.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${msg}</div>
                    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>`;
            container.appendChild(el);
            const instance = new bootstrap.Toast(el, { delay: 3000 });
            el.addEventListener('hidden.bs.toast', () => el.remove());
            instance.show();
        }

        function resetSettings() {
            sendMessage('#resetSettings');
            window.location.reload();
        }

        function saveSettings() {
            const config = {
                cmd: "#saveSettings",
                applicationConfig: [],
                trackerConfig: []
            };
            // Get values from Application Config inputs
            const banchoId = document.getElementById('bancho_id_key').value;
            const titanicId = document.getElementById('titanic_id_key').value;
            const clientId = document.getElementById('client_id_key').value;
            const clientSecret = document.getElementById('client_secret_key').value;
            const apiRefreshInterval = document.getElementById('api_refreshInterval_key').value;
            const gameMode = document.getElementById('gameMode_key').value;
            const server = document.getElementById('server_key').value;
            if (apiRefreshInterval == "" || apiRefreshInterval < 5000) {
                sendNotif("Invalid API Refresh Interval has been set.");
                return;
            }

            // Add Application Config values to the array
            config.applicationConfig.push({ key: 'banchoId',  value: banchoId });
            config.applicationConfig.push({ key: 'titanicId', value: titanicId });
            config.applicationConfig.push({ key: 'clientId', value: clientId });
            config.applicationConfig.push({ key: 'clientSecret', value: clientSecret });
            config.applicationConfig.push({ key: 'apiInterval', value: apiRefreshInterval });
            config.applicationConfig.push({ key: 'gameMode', value: gameMode });
            config.applicationConfig.push({ key: 'server', value: server });

            // Tracker Config
            const trackerContainer = document.getElementById('tracker-config-container');
            if (trackerContainer) {
                trackerContainer.querySelectorAll('[data-key]').forEach((row, idx) => {
                    config.trackerConfig.push({
                        key:     row.dataset.key,
                        display: row.querySelector('input[type="checkbox"]').checked,
                        sort:    idx + 1
                    });
                });
            }

            sendMessage("#saveSettings", config);

        };

        window.onload = connectWebSocket;
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-lg">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <span id="title-display">osu! Tracker</span>
                <span class="badge text-bg-primary" id="version-display">{{version}}</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item"><a class="nav-link {{nav_index_active}}" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link {{nav_settings_active}}" href="/settings">Settings</a></li>
                    <li class="nav-item"><a class="nav-link {{nav_help_active}}" href="/help">Help</a></li>
                    <li class="nav-item"><a class="nav-link {{nav_info_active}}" href="/info">Info</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="ws-conn-lost" class="alert mb-0" role="alert" hidden>
        WebSocket connection lost - reconnecting...
    </div>

    <div class="container-lg py-4 py-lg-5">
        <!-- Route Content -->
        {{{route_content}}}
    </div>

    <div id="toast-container" class="toast-container bottom-0 end-0 p-3 d-flex flex-column gap-2">
    </div>
</body>
</html>
